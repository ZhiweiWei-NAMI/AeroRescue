[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aerorescue"
version = "0.1.0"
description = "Reproducible rescue participation data and training, separate from AeroAgentSim"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
peft = ["torch>=2.6", "transformers>=5.3", "peft>=0.18.1", "accelerate>=1.10"]

[project.scripts]
aerorescue = "aerorescue.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.entry-points."aeroagentsim.engines"]
rescue_scenes = "rescue_scenes.engine:build"

[project.entry-points."aeroagentsim.scenarios"]
rescue_scenes = "rescue_scenes.scenario_plugin:plugin"

[tool.setuptools.package-data]
rescue_scenes = ["catalog/*", "SOURCES.json", "templates/*/template.yaml", "templates/*/scenario.json", "templates/*/registry.snapshot.json", "templates/*/README.md", "templates/*/thumbnail.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
